<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Page Not Found - The Coding Science</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet"/>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: "#6366f1",
                        secondary: "#4f46e5",
                        "background-light": "#f8fafc",
                        "background-dark": "#0f172a",
                        "card-light": "#ffffff",
                        "card-dark": "#1e293b",
                    },
                    fontFamily: {
                        display: ["Inter", "sans-serif"],
                        sans: ["Inter", "sans-serif"],
                    },
                },
            },
        };
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 min-h-screen flex flex-col">
    <header class="bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 px-6 py-4">
        <div class="flex items-center gap-2">
            <div class="w-8 h-8 bg-primary rounded-lg flex items-center justify-center text-white">
                <span class="material-icons text-xl">code</span>
            </div>
            <span class="font-bold text-lg tracking-tight">The Coding Science</span>
        </div>
    </header>

    <main class="flex-1 flex items-center justify-center px-6">
        <div class="text-center max-w-md">
            <span class="material-icons text-6xl text-primary mb-4">error_outline</span>
            <h1 class="text-4xl font-extrabold mb-4">404</h1>
            <h2 class="text-xl font-bold mb-2">Page Not Found</h2>
            <p class="text-slate-600 dark:text-slate-400 mb-8">
                Oops! The page you're looking for doesn't exist or has been moved.
            </p>
            <a href="./index.html" class="inline-flex items-center gap-2 bg-primary hover:bg-secondary text-white font-bold py-3 px-6 rounded-full transition-colors">
                <span class="material-icons">home</span>
                Back to Home
            </a>
        </div>
    </main>

    <footer class="bg-slate-900 text-white px-6 py-8 mt-auto">
        <div class="text-center text-slate-400 text-sm">
            <p>&copy; 2024 The Coding Science. All rights reserved.</p>
        </div>
    </footer>
</body>
</html>
